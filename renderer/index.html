<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <title>cue</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">

    <!-- Toolbar. The only always-visible chrome, so it stays to four controls. -->
    <div id="toolbar" class="drag-handle" role="toolbar" aria-label="cue">
      <button class="tb-grip" id="grip-btn" data-i18n-title="toolbar.move" tabindex="-1" aria-hidden="true"></button>
      <button class="tb-logo" id="logo-btn" data-i18n-title="toolbar.guide"></button>
      <div class="tb-divider" role="separator"></div>
      <button class="tb-hide" id="hide-btn" aria-expanded="true" aria-controls="panel">
        <span class="chev" aria-hidden="true"></span><span class="tb-hide-label" data-i18n="toolbar.hide"></span>
      </button>
      <div class="tb-divider" role="separator"></div>
      <button class="tb-listen" id="stop-btn" aria-pressed="false"></button>
      <div class="tb-divider" role="separator"></div>
      <button class="tb-quit" id="quit-btn"></button>
    </div>

    <!-- Panel + conversation rail travel together as one grid, so opening the
         rail never needs a hardcoded offset to shove the panel sideways. -->
    <div id="stage">
      <div id="panel-wrap">
        <div id="panel" class="glass no-drag">

          <!-- Signature element: the listening bar IS the audio. It fills from
               the left when the other person speaks and from the right when you
               do, and replaces the five separate state indicators this UI grew.
               Peripheral on purpose — your eyes belong on the camera. -->
          <div id="listen-bar" class="listen-bar" role="status" aria-live="polite">
            <span class="lb-fill lb-them" id="lb-them" aria-hidden="true"></span>
            <span class="lb-fill lb-you" id="lb-you" aria-hidden="true"></span>
            <span class="lb-label" id="lb-label"></span>
          </div>

          <div id="messages" role="log" aria-live="polite" aria-atomic="false"></div>

          <div id="action-row" role="group">
            <button class="act act-primary" data-mode="say" data-i18n-title="action.say.tip">
              <span class="ic" aria-hidden="true"></span><span data-i18n="action.say"></span>
              <kbd class="shortcut-hint" id="say-shortcut-hint"></kbd>
            </button>
            <button class="act" data-mode="assist" data-i18n-title="action.assist.tip">
              <span class="ic" aria-hidden="true"></span><span data-i18n="action.assist"></span>
              <kbd class="shortcut-hint" id="assist-shortcut-hint"></kbd>
            </button>
            <button class="act" data-mode="followup" data-i18n-title="action.followup.tip">
              <span class="ic" aria-hidden="true"></span><span data-i18n="action.followup"></span>
            </button>
            <button class="act" data-mode="recap" data-i18n-title="action.recap.tip">
              <span class="ic" aria-hidden="true"></span><span data-i18n="action.recap"></span>
            </button>
          </div>

          <div id="composer">
            <div id="input-area">
              <div id="placeholder" aria-hidden="true"></div>
              <label class="sr-only" for="input" data-i18n="composer.placeholder"></label>
              <textarea id="input" rows="1" spellcheck="false"></textarea>
            </div>
            <div id="composer-bottom">
              <button id="smart-toggle" class="pill" aria-pressed="false">
                <span class="ic" aria-hidden="true"></span><span data-i18n="composer.smart"></span>
              </button>
              <button id="autofill-toggle" class="pill pill-quiet" aria-pressed="true">
                <span class="ic" aria-hidden="true"></span>
              </button>
              <button id="history-btn" class="icon-btn" data-i18n-title="composer.history" aria-expanded="false" aria-controls="transcript-rail">
                <span class="ic" aria-hidden="true"></span>
                <span class="badge" id="history-badge" hidden></span>
              </button>
              <button id="more-btn" class="icon-btn"></button>
              <div class="spacer"></div>
              <button id="stop-answer-btn" class="icon-btn danger" data-i18n-title="composer.stop.tip" hidden></button>
              <button id="send-btn" class="send"></button>
            </div>
          </div>

          <div id="prep-status" class="prep-status">
            <button class="prep-item" data-field="resume" data-name="prep.resume"><span class="prep-dot" aria-hidden="true"></span><span data-i18n="prep.resume"></span></button>
            <button class="prep-item" data-field="jd" data-name="prep.jd"><span class="prep-dot" aria-hidden="true"></span><span data-i18n="prep.jd"></span></button>
            <button class="prep-item" data-field="stories" data-name="prep.stories"><span class="prep-dot" aria-hidden="true"></span><span data-i18n="prep.stories"></span></button>
            <button class="prep-item" data-field="salary" data-name="prep.salary"><span class="prep-dot" aria-hidden="true"></span><span data-i18n="prep.salary"></span></button>
          </div>
        </div>
      </div>

      <!-- Conversation rail — a grid sibling, not a floating overlay -->
      <aside id="transcript-rail" class="rail glass hidden" aria-label="Conversation">
        <header class="rail-head">
          <h2 class="rail-title" data-i18n="transcript.title"></h2>
          <button class="icon-btn small" id="close-rail-btn" data-i18n-title="transcript.close"></button>
        </header>
        <div id="ts-list" class="rail-list" role="log" aria-live="polite">
          <p class="rail-empty" data-i18n="transcript.empty"></p>
        </div>
        <footer class="rail-foot">
          <button class="rail-action" id="export-transcript-btn" data-i18n="transcript.export"></button>
          <button class="rail-action danger" id="clear-transcript-btn" data-i18n="transcript.clear"></button>
        </footer>
      </aside>
    </div>
  </div>

  <!-- ============================ Settings ============================ -->
  <div id="settings-scrim" class="scrim hidden">
    <div id="settings" class="glass" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <header class="s-head">
        <h2 class="s-title" id="settings-title" data-i18n="settings.title"></h2>
        <div class="s-search-wrap">
          <input id="settings-search" type="search" class="s-search" data-i18n-placeholder="settings.search" autocomplete="off" spellcheck="false" />
        </div>
        <button id="s-close" class="s-close" data-i18n="settings.done"></button>
      </header>

      <div class="s-tabs" role="tablist">
        <button class="s-tab on" role="tab" aria-selected="true" data-tab="keys" data-i18n="settings.tab.keys"></button>
        <button class="s-tab" role="tab" aria-selected="false" data-tab="transcription" data-i18n="settings.tab.audio"></button>
        <button class="s-tab" role="tab" aria-selected="false" data-tab="profile" data-i18n="settings.tab.profile"></button>
        <button class="s-tab" role="tab" aria-selected="false" data-tab="prep" data-i18n="settings.tab.prep"></button>
        <button class="s-tab" role="tab" aria-selected="false" data-tab="qa" data-i18n="settings.tab.qa"></button>
        <button class="s-tab" role="tab" aria-selected="false" data-tab="style" data-i18n="settings.tab.style"></button>
        <button class="s-tab" role="tab" aria-selected="false" data-tab="general" data-i18n="settings.tab.general"></button>
      </div>

      <p class="s-search-empty hidden" id="s-search-empty"></p>

      <!-- ---- AI provider ---- -->
      <section class="s-pane" role="tabpanel" data-pane="keys">
        <div class="s-group" data-search="provider openai anthropic gemini ollama groq minimax azure custom">
          <h3 class="s-label" data-i18n="settings.provider"></h3>
          <div class="s-seg s-seg-wrap" id="provider-seg" role="radiogroup">
            <button data-provider="openai" role="radio" aria-checked="true">OpenAI</button>
            <button data-provider="anthropic" role="radio" aria-checked="false">Anthropic</button>
            <button data-provider="gemini" role="radio" aria-checked="false">Gemini</button>
            <button data-provider="groq" role="radio" aria-checked="false">Groq</button>
            <button data-provider="ollama" role="radio" aria-checked="false">Ollama</button>
            <button data-provider="minimax" role="radio" aria-checked="false">MiniMax</button>
            <button data-provider="azure" role="radio" aria-checked="false">Azure</button>
            <button data-provider="custom" role="radio" aria-checked="false">Custom</button>
          </div>
          <p class="s-note" data-i18n="settings.provider.hint"></p>
        </div>

        <!-- Only the selected provider's credential is shown. Nine key fields
             where one is relevant was the single densest screen in the app. -->
        <div class="s-group" data-search="api key credential secret token">
          <h3 class="s-label"><span data-i18n="settings.key"></span> <a class="s-link" id="key-help-link" href="#" data-i18n="settings.key.get"></a></h3>
          <div class="s-field">
            <span class="s-field-name" id="active-key-name"></span>
            <input id="active-key" type="password" autocomplete="off" spellcheck="false" />
            <button class="s-reveal" id="key-reveal" aria-pressed="false"></button>
          </div>
          <p class="s-note" id="key-storage-note"></p>

          <div id="provider-extra"></div>

          <div class="s-actions">
            <button class="s-action primary" id="test-provider" data-i18n="settings.test"></button>
            <span class="s-result" id="test-result" role="status" aria-live="polite"></span>
          </div>
        </div>

        <div class="s-group" data-search="model fast smart gpt claude gemini llama">
          <h3 class="s-label" data-i18n="settings.models"></h3>
          <div class="s-field">
            <span class="s-field-name" data-i18n="settings.model.fast"></span>
            <input id="model-fast" list="model-suggestions" autocomplete="off" spellcheck="false" />
          </div>
          <div class="s-field">
            <span class="s-field-name" data-i18n="settings.model.smart"></span>
            <input id="model-smart" list="model-suggestions" autocomplete="off" spellcheck="false" />
          </div>
          <datalist id="model-suggestions"></datalist>
          <p class="s-note" data-i18n="settings.models.hint"></p>
        </div>

        <details class="s-group s-details" data-search="other keys deepgram transcription">
          <summary class="s-label"><span data-i18n="settings.otherkeys"></span></summary>
          <p class="s-note" data-i18n="settings.otherkeys.hint"></p>
          <div id="other-keys"></div>
        </details>

        <div class="s-group" data-search="access programs assistant applink permission">
          <h3 class="s-label" data-i18n="settings.access"></h3>
          <div class="s-callers" id="applink-callers"></div>
        </div>

        <p class="s-status" id="s-status" role="status" aria-live="polite"></p>
      </section>

      <!-- ---- Listening ---- -->
      <section class="s-pane hidden" role="tabpanel" data-pane="transcription">
        <div class="s-group" data-search="speech transcription whisper deepgram local privacy">
          <h3 class="s-label" data-i18n="settings.stt"></h3>
          <div class="s-seg s-seg-wrap" id="stt-provider-seg" role="radiogroup">
            <button data-stt-provider="auto" role="radio" data-i18n="settings.stt.auto"></button>
            <button data-stt-provider="local" role="radio" data-i18n="settings.stt.local"></button>
            <button data-stt-provider="deepgram" role="radio">Deepgram</button>
            <button data-stt-provider="openai" role="radio">OpenAI</button>
            <button data-stt-provider="gemini" role="radio">Gemini</button>
          </div>
          <p class="s-note" id="stt-note"></p>
        </div>

        <div class="s-group s-card" id="whisper-card" data-search="whisper model download local offline">
          <div class="s-row">
            <h3 class="s-label" data-i18n="settings.whisper.runtime"></h3>
            <span id="whisper-runtime-status" class="s-badge"></span>
          </div>
          <label class="s-label" for="whisper-model" data-i18n="settings.whisper.model"></label>
          <select id="whisper-model" class="s-select"></select>
          <p id="whisper-model-detail" class="s-note"></p>
          <div id="whisper-progress-wrap" class="s-progress hidden">
            <progress id="whisper-progress" max="100" value="0"></progress>
            <span id="whisper-progress-label" class="s-mono">0%</span>
          </div>
          <div class="s-actions">
            <button id="whisper-download" class="s-action" data-i18n="settings.whisper.download"></button>
            <button id="whisper-cancel" class="s-action hidden" data-i18n="settings.whisper.cancel"></button>
            <button id="whisper-import" class="s-action" data-i18n="settings.whisper.import"></button>
            <button id="whisper-delete" class="s-action danger" data-i18n="settings.whisper.delete" disabled></button>
          </div>
          <div class="s-field">
            <span class="s-field-name" data-i18n="settings.whisper.language"></span>
            <select id="whisper-language" class="s-select compact">
              <option value="auto" data-i18n="settings.whisper.language.auto"></option>
              <option value="en">English</option>
              <option value="fr">Français</option>
            </select>
          </div>
          <div class="s-field">
            <span class="s-field-name" data-i18n="settings.whisper.threads"></span>
            <input id="whisper-threads" type="number" min="0" max="64" step="1" value="0" />
          </div>
          <p class="s-note" data-i18n="settings.whisper.threads.hint"></p>
        </div>

        <div class="s-group" data-search="autofill question box automatic">
          <label class="s-toggle">
            <input type="checkbox" id="autofill-setting" />
            <span data-i18n="settings.autofill"></span>
          </label>
          <p class="s-note" data-i18n="settings.autofill.hint"></p>
        </div>

        <p class="s-status" id="whisper-status" role="status" aria-live="polite"></p>
      </section>

      <!-- ---- About you ---- -->
      <section class="s-pane hidden" role="tabpanel" data-pane="profile">
        <div class="s-group" data-search="resume cv experience">
          <h3 class="s-label"><span data-i18n="settings.resume"></span> <span class="s-hint" data-i18n="settings.resume.hint"></span></h3>
          <div class="s-upload"><span class="s-filename" id="resume-filename"></span><button class="s-action" id="upload-resume-btn" data-i18n="settings.import"></button></div>
          <textarea id="resume-text" rows="7" spellcheck="false" data-i18n-placeholder="settings.resume.placeholder"></textarea>
        </div>
        <div class="s-group" data-search="job description role target">
          <h3 class="s-label"><span data-i18n="settings.jd"></span> <span class="s-hint" data-i18n="settings.jd.hint"></span></h3>
          <div class="s-upload"><span class="s-filename" id="jd-filename"></span><button class="s-action" id="upload-jd-btn" data-i18n="settings.import"></button></div>
          <textarea id="job-description" rows="5" spellcheck="false" data-i18n-placeholder="settings.jd.placeholder"></textarea>
        </div>
      </section>

      <!-- ---- Interview prep ---- -->
      <section class="s-pane hidden" role="tabpanel" data-pane="prep">
        <div class="s-group" data-search="star stories behavioral">
          <h3 class="s-label"><span data-i18n="settings.stories"></span> <span class="s-hint" data-i18n="settings.stories.hint"></span></h3>
          <textarea id="star-stories" rows="8" spellcheck="false"></textarea>
        </div>
        <div class="s-group" data-search="why company motivation">
          <h3 class="s-label" data-i18n="settings.whyCompany"></h3>
          <textarea id="why-company" rows="3" spellcheck="false"></textarea>
        </div>
        <div class="s-group" data-search="why leaving current role">
          <h3 class="s-label"><span data-i18n="settings.whyLeaving"></span> <span class="s-hint" data-i18n="settings.whyLeaving.hint"></span></h3>
          <textarea id="why-leaving" rows="2" spellcheck="false"></textarea>
        </div>
        <div class="s-group" data-search="work style values culture">
          <h3 class="s-label"><span data-i18n="settings.workStyle"></span> <span class="s-hint" data-i18n="settings.workStyle.hint"></span></h3>
          <textarea id="work-style" rows="3" spellcheck="false"></textarea>
        </div>
      </section>

      <!-- ---- Questions ---- -->
      <section class="s-pane hidden" role="tabpanel" data-pane="qa">
        <div class="s-group" data-search="salary compensation pay">
          <h3 class="s-label" data-i18n="settings.salary"></h3>
          <input id="salary-target" type="text" class="s-input-wide" autocomplete="off" />
        </div>
        <div class="s-group" data-search="questions ask interviewer">
          <h3 class="s-label"><span data-i18n="settings.questions"></span> <span class="s-hint" data-i18n="settings.questions.hint"></span></h3>
          <textarea id="questions-to-ask" rows="6" spellcheck="false"></textarea>
        </div>
      </section>

      <!-- ---- Style ---- -->
      <section class="s-pane hidden" role="tabpanel" data-pane="style">
        <div class="s-group" data-search="rules tone voice writing style">
          <h3 class="s-label"><span data-i18n="settings.rules"></span> <span class="s-hint" data-i18n="settings.rules.hint"></span></h3>
          <textarea id="ai-rules" rows="10" spellcheck="false" maxlength="2000"></textarea>
          <div class="s-counter"><span id="ai-rules-count" class="s-mono">0</span> / 2000</div>
          <p class="s-note" data-i18n-html="settings.rules.help"></p>
        </div>
      </section>

      <!-- ---- General ---- -->
      <section class="s-pane hidden" role="tabpanel" data-pane="general">
        <div class="s-group" data-search="language interface locale">
          <h3 class="s-label" data-i18n="settings.language"></h3>
          <select id="ui-language" class="s-select"></select>
        </div>
        <div class="s-group" data-search="answer language reply">
          <h3 class="s-label" data-i18n="settings.answerLanguage"></h3>
          <select id="answer-language" class="s-select"></select>
          <p class="s-note" data-i18n="settings.answerLanguage.hint"></p>
        </div>
        <div class="s-group" data-search="text size appearance readable">
          <h3 class="s-label" data-i18n="settings.textSize"></h3>
          <input type="range" id="text-scale" min="0.85" max="1.3" step="0.05" class="s-range" />
        </div>
        <div class="s-group" data-search="opacity transparency see through">
          <h3 class="s-label" data-i18n="settings.opacity"></h3>
          <input type="range" id="panel-opacity" min="0.4" max="0.95" step="0.05" class="s-range" />
          <p class="s-note" data-i18n="settings.opacity.hint"></p>
        </div>
        <div class="s-group" data-search="shortcuts keyboard keys">
          <h3 class="s-label" data-i18n="settings.shortcuts"></h3>
          <div id="shortcut-list" class="s-shortcuts"></div>
        </div>
        <div class="s-group" data-search="quit confirm close">
          <label class="s-toggle"><input type="checkbox" id="confirm-quit" /><span data-i18n="settings.confirmQuit"></span></label>
          <p class="s-note" data-i18n="settings.confirmQuit.hint"></p>
        </div>
        <div class="s-group" data-search="motion animation reduce">
          <label class="s-toggle"><input type="checkbox" id="reduce-motion" /><span data-i18n="settings.reduceMotion"></span></label>
        </div>
        <div class="s-group" data-search="disguise process name stealth hidden">
          <label class="s-toggle"><input type="checkbox" id="disguise-process" /><span data-i18n="settings.disguise"></span></label>
          <p class="s-note" data-i18n="settings.disguise.hint"></p>
        </div>
      </section>
    </div>
  </div>

  <!-- ============================ Onboarding ============================ -->
  <div id="onboard-scrim" class="scrim hidden">
    <div id="onboard" class="glass" role="dialog" aria-modal="true" aria-labelledby="ob-title">
      <div class="ob-dots" id="ob-dots" aria-hidden="true"></div>
      <div class="ob-icon" id="ob-icon" aria-hidden="true"></div>
      <h2 class="ob-title" id="ob-title"></h2>
      <div class="ob-body" id="ob-body"></div>
      <div class="ob-checks" id="ob-checks"></div>
      <div class="ob-buttons" id="ob-buttons"></div>
      <div class="ob-actions">
        <button id="ob-skip" class="ghost" data-i18n="ob.skip"></button>
        <div class="spacer"></div>
        <button id="ob-back" class="ghost" data-i18n="ob.back"></button>
        <button id="ob-next" class="primary"></button>
      </div>
    </div>
  </div>

  <!-- Assistant access request. Shown in-window rather than as a native dialog:
       cue hides its dock icon, so an OS panel never comes forward and cannot be
       clicked. -->
  <div id="consent-scrim" class="scrim hidden">
    <div id="consent" class="glass" role="dialog" aria-modal="true" aria-labelledby="cs-title">
      <h2 class="cs-title" id="cs-title"></h2>
      <p class="cs-body" id="cs-body"></p>
      <div class="cs-actions">
        <button id="cs-deny" class="ghost" data-i18n="consent.deny"></button>
        <button id="cs-allow" class="primary" data-i18n="consent.allow"></button>
      </div>
    </div>
  </div>

  <!-- Quit confirmation. Quitting discards the conversation, and the quit
       shortcut sits one key away from the hide shortcut. -->
  <div id="quit-scrim" class="scrim hidden">
    <div id="quit-dialog" class="glass" role="dialog" aria-modal="true" aria-labelledby="quit-title">
      <h2 class="cs-title" id="quit-title" data-i18n="quit.title"></h2>
      <p class="cs-body" data-i18n="quit.body"></p>
      <div class="cs-actions">
        <button id="quit-cancel" class="ghost" data-i18n="quit.cancel"></button>
        <button id="quit-export" class="ghost" data-i18n="quit.export"></button>
        <button id="quit-confirm" class="primary danger" data-i18n="quit.confirm"></button>
      </div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="locales.js"></script>
  <script src="i18n.js"></script>
  <script src="markdown.js"></script>
  <script src="icons.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
